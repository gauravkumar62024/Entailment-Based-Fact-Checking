### model
model_name_or_path: mistralai/Mistral-7B-Instruct-v0.3
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_target: all
loraplus_lr_ratio: 16.0

### dataset
dataset: mistral_rawfc_train_llama_fact_transformed_dataset,mistral_rawfc_train_llama_fact_transformed_dataset
template: mistral
cutoff_len: 2048
max_samples: null
overwrite_cache: true
preprocessing_num_workers: 16

### output
output_dir: checkpoint/TBE3/RAWFC/LoRA++/random_seed/mistral/seed_999
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
seed: 999
### eval
val_size: 0.1
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 500


